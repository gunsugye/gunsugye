<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지도생도 군수 관리</title>
<link rel="stylesheet" href="./assets/instructor.css?v=eea58f134276f6be"><script src="./config.js"></script></head>
<body><main>
<header><div><small>성무기초군사훈련</small><h1>지도생도 군수 관리</h1></div><button id="logout" hidden>로그아웃</button></header>
<section id="login" class="card"><h2>지도생도 선택</h2><p>훈련 준비 기간 · 인증 없이 이용</p><div id="googleButton"></div></section>
<p id="message" role="status" aria-live="polite"></p><button id="retry" hidden>다시 불러오기</button>
<section id="workspace" hidden><div class="toolbar"><p id="identity"></p><button id="refresh">새로고침</button></div>
<div class="tabs"><button id="peopleTab" aria-pressed="true">담당 예비생도</button><button id="requestsTab" aria-pressed="false">수정 요청</button></div>
<div id="people"></div><div id="requests" hidden></div></section>
<dialog id="requestDialog"><form id="requestForm"><h2 id="requestTitle">수정 요청</h2><input type="hidden" id="personId">
<label>구분<select id="kind"><option>군수품</option><option>피복</option></select></label>
<label>품목<input id="itemName" required maxlength="80"></label>
<div class="fields"><label>사이즈·규격<input id="value" maxlength="100"></label><label>수량<input id="quantity" inputmode="decimal" maxlength="30"></label></div>
<label>상태<select id="condition"><option>정상</option><option>수리 필요</option><option>교체 필요</option></select></label>
<label>세부사항<textarea id="detail" maxlength="1500" rows="2"></textarea></label>
<label>요청 사유<textarea id="reason" required maxlength="1000" rows="2"></textarea></label>
<p id="requestMessage" role="status"></p><div class="actions"><button id="cancel" type="button">취소</button><button id="send" type="submit" class="primary">요청 등록</button></div>
</form></dialog></main><script src="./assets/instructor.js?v=d9489850a9ada526"></script></body></html>
