<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>내 군수 정보</title><link rel="stylesheet" href="./portal.css?v=b97fc9d83ca42cb3"><script src="../config.js"></script><script src="./portal.js?v=16d49f17091be24a" defer></script></head><body>
<header><a class="brand" href="./">군수계 <span>개인 조회</span></a><a class="admin" href="../">관리자 로그인 ↗</a></header>
<section id="login" class="login"><p class="eyebrow">MY LOGISTICS</p><h1>내 군수 정보</h1><p class="sub">이름과 총기번호로 확인하세요.</p><form id="loginForm" autocomplete="off"><label for="name">이름</label><input id="name" maxlength="60" required placeholder="명단에 등록된 이름" autocomplete="off"><label for="number">총기번호</label><input id="number" type="password" maxlength="60" required autocomplete="off" placeholder="총기번호 입력"><button id="submit" type="submit">본인 정보 조회</button></form><p class="hint">명단(총기번호) 관리 기준 · 인증 유지 15분</p></section>
<p id="status" role="status" aria-live="polite"></p>
<main id="dashboard" hidden><div class="page-head"><div><p class="eyebrow">MY LOGISTICS</p><h1 id="personName"></h1><p id="personMeta" class="sub"></p></div><div class="actions"><button id="refresh" type="button">새로고침</button><button id="logout" type="button">종료</button></div></div><p id="warnings" class="warning" hidden></p>
<div class="grid"><section class="card"><h2>생활실</h2><p id="room" class="room"></p></section><section class="card"><h2>총기</h2><dl id="firearm"></dl></section><section class="card wide"><h2>군수품</h2><div id="supplies"></div></section><section class="card"><h2>피복 사이즈</h2><dl id="uniform"></dl></section><section class="card"><h2>소속 중대 사역</h2><div id="labor"></div><p class="hint">중대별 지급량 · 개인 지급량 아님</p></section></div><p id="updated" class="hint"></p></main>
<footer>조회 전용 · 수정 문의는 군수 담당자에게</footer></body></html>
